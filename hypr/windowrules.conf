##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrule = opacity .97 .93,class:^(vivaldi-stable)$
# windowrule = maximize,class:^(vivaldi-stable)$
windowrule = opacity .95 .9,class:^(Code)$

# # Qt apps with rounded borders when focused
# windowrulev2 = bordercolor rgb(E21A2B) rgb(6F7B84),title:^(qs -c widget)$
# windowrulev2 = rounding 12,title:^(qs -c widget)$
# windowrulev2 = bordersize 3,title:^(qs -c widget)$

# # Additional Qt-based apps patterns
# windowrulev2 = bordercolor rgb(E21A2B) rgb(6F7B84),class:^(dolphin)$
# windowrulev2 = rounding 12,class:^(dolphin)$
# windowrulev2 = bordersize 3,class:^(dolphin)$

# windowrulev2 = bordercolor rgb(E21A2B) rgb(6F7B84),class:^(kate)$
# windowrulev2 = rounding 12,class:^(kate)$
# windowrulev2 = bordersize 3,class:^(kate)$

# windowrulev2 = bordercolor rgb(E21A2B) rgb(6F7B84),class:^(kwrite)$
# windowrulev2 = rounding 12,class:^(kwrite)$
# windowrulev2 = bordersize 3,class:^(kwrite)$

# Layout configurations
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

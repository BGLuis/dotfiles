general {
    lock_cmd = qs -c widget ipc call lock lock  # The lockscreen is Quickshell's; launching hyprlock too made two clients fight over ext-session-lock.
    before_sleep_cmd = qs -c widget ipc call lock lockImmediate  # Instant lock without screenshot freeze before sleep.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && qs -c widget ipc call lock refresh  # Lua config: the legacy `dpms on` syntax fails to parse.
}

listener {
    timeout = 300                               # 5 minutes (300 seconds)
    on-timeout = loginctl lock-session          # Use logind to lock the session. This sends a DBus signal that hypridle's lock_cmd is configured to catch, ensuring robust system integration.
}

listener {
    timeout = 360                               # 6 minutes (300s idle + 60s locked)
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'      # Power down all displays.
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && qs -c widget ipc call lock refresh  # Quickshell redraws the lock surfaces once outputs return.
}

# Listener 3: Transition from Modern Standby (screen off) to system suspend after 30 minutes.
listener {
    timeout = 1800                              # 30 minutes (1800 seconds)
    on-timeout = systemctl suspend-then-hibernate  # Suspends to RAM, then hibernates per systemd-sleep policy.
}


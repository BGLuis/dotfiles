# ─────────────────────────────────────────────────────────────────────────────
# hyprsunset.conf — Perfis de temperatura de cor com transições suaves
#
# Estratégia: múltiplos perfis intermediários a cada ~30 min evitam saltos
# abruptos, tanto ao entardecer (aplicação) quanto ao amanhecer (remoção).
#
# Referência Kelvin:
#   6500K = Luz do dia neutra    | 4500K = Lâmpada quente
#   3500K = Noite / reduz azul  | 3200K = Noite avançada
# ─────────────────────────────────────────────────────────────────────────────

# ── AMANHECER: esfria gradualmente (remoção do filtro) ───────────────────────
profile {
    time        = 06:00
    temperature = 3400
    gamma       = 0.91
}

profile {
    time        = 06:30
    temperature = 3700
    gamma       = 0.93
}

profile {
    time        = 07:00
    temperature = 4200
    gamma       = 0.95
}

profile {
    time        = 07:30
    temperature = 4800
    gamma       = 0.97
}

profile {
    time        = 08:00
    temperature = 5400
    gamma       = 0.99
}

profile {
    time        = 08:30
    temperature = 6000
    gamma       = 1.0
}

# ── DIA: Neutro pleno ────────────────────────────────────────────────────────
profile {
    time        = 09:00
    temperature = 6500
    gamma       = 1.0
}

profile {
    time        = 15:00
    temperature = 6500
    gamma       = 1.0
}

# ── PRÉ-ENTARDECER: esquenta gradualmente ────────────────────────────────────
profile {
    time        = 16:30
    temperature = 6000
    gamma       = 1.0
}

profile {
    time        = 17:00
    temperature = 5500
    gamma       = 1.0
}

profile {
    time        = 17:30
    temperature = 5000
    gamma       = 1.0
}

# ── PÔR DO SOL ───────────────────────────────────────────────────────────────

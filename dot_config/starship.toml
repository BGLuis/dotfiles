"$schema" = 'https://starship.rs/config-schema.json'

# Adiciona uma linha em branco entre os comandos para o terminal respirar
add_newline = true

# Formato do prompt em 2 linhas
# Linha 1: Contexto de trabalho (usuário, host SSH, pasta, git branch/status, background jobs)
# Linha 2: Símbolo lambda (λ) para digitação de comandos
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$jobs\
$line_break\
$character"""

# Formato do prompt da direita (RPROMPT)
# Exibe status de erro, duração de comandos lentos e ambientes de desenvolvimento instalados
right_format = """
$status\
$cmd_duration\
$nodejs\
$rust\
$golang\
$python\
$docker_context\
$terraform\
$kubernetes"""

# Configuração do usuário (sempre visível localmente conforme solicitado)
[username]
style_user = 'bold green'
style_root = 'bold red'
format = '[$user]($style) '
show_always = true

# Hostname visível apenas em sessões SSH
[hostname]
ssh_only = true
format = '󰖟 [$hostname](bold purple) '
disabled = false

# Diretório com truncamento inteligente ancorado na raiz do repositório Git
[directory]
style = 'bold cyan'
read_only = ' 󰌾'
truncation_length = 3
truncate_to_repo = true
read_only_style = 'red'
format = '[ $path]($style)[$read_only]($read_only_style) '
truncation_symbol = '…/'

# Branch Git
[git_branch]
symbol = ' '
format = '[$symbol$branch]($style) '
style = 'bold purple'

# Estado de operações Git (rebase, merge, cherry-pick, bisect)
[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = 'bold yellow'

# Status detalhado do repositório Git (reativado)
[git_status]
disabled = false
format = '([\[$all_status$ahead_behind\]]($style) )'
style = 'bold red'
stashed = '\$ '
staged = '[+$count ](green)'
modified = '[●$count ](yellow)'
untracked = '[?$count ](white)'
deleted = '[✘$count ](red)'
ahead = '⇡$count '
behind = '⇣$count '
diverged = '⇡$ahead_count ⇣$behind_count '
conflicted = '⚡ '

# Processos rodando em background
[jobs]
symbol = '✦ '
style = 'bold blue'
number_threshold = 1
format = '[$symbol$number]($style) '

# Tempo de execução para comandos lentos (>2s)
[cmd_duration]
min_time = 2_000
format = 'took [󱎫 $duration]($style) '
style = 'bold yellow'

# Indicador discreto de código de erro
[status]
disabled = false
format = '[$symbol$status]($style) '
symbol = '✘ '
style = 'bold red'

# Símbolo do prompt (lambda consistente: roxo no sucesso, vermelho no erro, verde no vi-mode)
[character]
success_symbol = '[λ](bold purple) '
error_symbol = '[λ](bold red) '
vimcmd_symbol = '[λ](bold green) '

# Módulo de package desativado
[package]
disabled = true

# Módulo de sistema operacional mantido desativado
[os]
disabled = true

[os.symbols]
Alpine = " "
Arch = " "
Debian = " "
EndeavourOS = " "
Fedora = " "
Linux = " "
Macos = " "
Manjaro = " "
Mint = " "
NixOS = " "
openSUSE = " "
Pop = " "
SUSE = " "
Ubuntu = " "
Windows = " "

# Módulos de linguagens e ferramentas (exibidos no prompt da direita apenas nos respectivos projetos)
[nodejs]
symbol = " "
format = '[$symbol($version )]($style)'
style = "bold green"

[rust]
symbol = " "
format = '[$symbol($version )]($style)'
style = "bold red"

[golang]
symbol = " "
format = '[$symbol($version )]($style)'
style = "bold cyan"

[python]
symbol = " "
format = '[$symbol($version )]($style)'
style = "bold yellow"

[docker_context]
symbol = " "
format = '[$symbol$context]($style) '
style = "bold blue"

[terraform]
symbol = "󱁢 "
format = '[$symbol$workspace]($style) '
style = "bold 105"

[kubernetes]
symbol = "󱃾 "
format = '[$symbol$context( ($namespace))]($style) '
style = "bold cyan"
disabled = false
detect_files = ['k8s', 'kubernetes', 'helmfile.yaml']
detect_extensions = ['k8s.yaml', 'k8s.yml']
detect_folders = ['k8s', 'kubernetes', 'manifests']

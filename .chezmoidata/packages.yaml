packages:
  # Pacotes para Arch Linux (pacman & yay)
  arch:
    # Essenciais de terminal: instalados em qualquer máquina, incluindo servidores headless
    core:
      pacman:
        - git
        - git-lfs
        - curl
        - starship
        - nano
        - zsh
        - btop
        - lazygit
        - tailscale
        - fzf
        - fd
        - bat
        - eza
        - lsd
        - zoxide
    # Pacotes de ambiente gráfico: pulados automaticamente quando chassisType = headless
    gui:
      pacman:
        - kitty
        - hyprland
        - hypridle
        - hyprlock
        - hyprpaper
        - hyprsunset
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk
        - polkit-kde-agent
        - qt5-wayland
        - qt6-wayland
        - qt6ct
        - quickshell
        - grim
        - slurp
        - cliphist
        - wl-clipboard
        - solaar
        - dolphin
        - ttf-jetbrains-mono-nerd
        - ttf-material-symbols-variable
        - discord
      aur:
        - vicinae-bin
        - bitwarden
        - visual-studio-code-bin
        - spotify-launcher
        - ttf-rubik-vf
    laptop:
      - brightnessctl

  # Pacotes para Debian/Ubuntu (apt)
  debian:
    apt:
      - git
      - git-lfs
      - curl
      - nano
      - kitty
      - btop
    # Instalações adicionais via snap/scripts (opcionais)
    snaps:
      - starship --classic
      - bitwarden
      - spotify
      - discord
      - code --classic

  # Pacotes para macOS (Homebrew)
  darwin:
    brews:
      - git
      - git-lfs
      - starship
      - nano
      - btop
      - lazygit
    casks:
      - kitty
      - bitwarden
      - tailscale
      - spotify
      - discord
      - visual-studio-code
      - font-jetbrains-mono-nerd-font

  # Pacotes para Windows (Winget)
  windows:
    winget:
      - Git.Git
      - Starship.Starship
      - Bitwarden.Bitwarden
      - Tailscale.Tailscale
      - Spotify.Spotify
      - Discord.Discord
      - Microsoft.VisualStudioCode
      - GNU.Nano
      - JetBrains.JetBrainsMonoNF

packages:
  # Pacotes para Arch Linux (pacman & yay)
  arch:
    # Essenciais de terminal: instalados em qualquer máquina, incluindo servidores headless
    core:
      pacman:
        - git
        - git-lfs
        - github-cli
        - curl
        - starship
        - nano
        - zsh
        - btop
        - lazygit
        - tailscale
        - fzf
        - fd
        - bat
        - eza
        - lsd
        - zoxide
        - jq
        - ripgrep
        - kitty-terminfo
        - pacman-contrib
    # Pacotes de ambiente gráfico: pulados automaticamente quando chassisType = headless
    gui:
      pacman:
        - kitty
        - hyprland
        - hypridle
        - hyprlock
        - awww
        - hyprsunset
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk
        - polkit-kde-agent
        - qt5-wayland
        - qt6-wayland
        - qt6ct
        - breeze
        - breeze-gtk
        - gnome-themes-extra
        - quickshell
        - grim
        - slurp
        - cliphist
        - wl-clipboard
        - solaar
        - dolphin
        - ark
        - zip
        - unzip
        - 7zip
        - unrar
        - playerctl
        - vivaldi
        - bitwarden
        - gnome-keyring
        - spotify-launcher
        - ttf-jetbrains-mono-nerd
        - ttf-material-symbols-variable
        - discord
        - libnotify
        - networkmanager
        - network-manager-applet
        - blueman
        - pavucontrol
      aur:
        - vicinae-bin
        - visual-studio-code-bin
        - ttf-rubik-vf
        - bibata-cursor-theme
        - claude-code
    laptop:
      - brightnessctl
      - power-profiles-daemon
      - fprintd
      - libfprint

  # Pacotes para Debian/Ubuntu (apt)
  debian:
    # Essenciais de terminal: instalados em qualquer máquina, incluindo servidores headless
    core:
      apt:
        - git
        - git-lfs
        - github-cli
        - curl
        - nano
        - btop
        - kitty-terminfo
      snaps:
        - starship --classic
    # Pacotes de ambiente gráfico: pulados automaticamente quando chassisType = headless
    gui:
      apt:
        - kitty
      snaps:
        - bitwarden
        - spotify
        - discord
        - code --classic

  # Pacotes para macOS (Homebrew)
  darwin:
    brews:
      - git
      - git-lfs
      - gh
      - starship
      - nano
      - btop
      - lazygit
    casks:
      - kitty
      - bitwarden
      - tailscale
      - spotify
      - discord
      - visual-studio-code
      - font-jetbrains-mono-nerd-font

  # Pacotes para Windows (Winget)
  windows:
    winget:
      - Git.Git
      - GitHub.cli
      - Starship.Starship
      - Bitwarden.Bitwarden
      - Tailscale.Tailscale
      - Spotify.Spotify
      - Discord.Discord
      - Microsoft.VisualStudioCode
      - GNU.Nano
      - JetBrains.JetBrainsMonoNF
